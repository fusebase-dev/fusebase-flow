# Fusebase Flow — model routing policy (committed default; OPTIONAL).
#
# Maps a WORK PROPERTY to a model selector. Tier meanings, routing and fallback
# behaviour are owned by `flow-skills/task-delegation/SKILL.md` § Model routing;
# this file carries only the per-project selection.
#
# TRIPWIRE: a tier selects a MODEL, never a permission. Role authority, approval
# artifacts and gate ownership are unchanged by anything in this file (FR-12).
# TRIPWIRE: every row ships null. Flow names no model and no loader resolves these
# selectors today — the routing contract is instruction-level, read by the agent.
# `null` = use the host's current model. Absent, malformed or unreachable selector
# = a RECORDED fallback, never a reason to stop a run.
#
# Per-machine override: policies/model-routing.local.yml (gitignored via policies/*.local.yml).
schema_version: 1

tiers:
  planning:                 { model: null, family: null }
  adversarial_review:       { model: null, family: null }
  sensitive_implementation: { model: null, family: null }
  routine_implementation:   { model: null, family: null }
  execution:                { model: null, family: null }

# HOW A PROJECT FILLS THIS IN — illustration only. These are not defaults, and Flow
# makes no claim that any model or family is reachable from your host.
#
#   tiers:
#     planning:                 { model: opus, family: null }
#     adversarial_review:       { model: null, family: "<a family other than the implementer's>" }
#     sensitive_implementation: { model: "<exact-pinned-model-id>", family: null }
#     routine_implementation:   { model: sonnet, family: null }
#     execution:                { model: haiku, family: null }
#
# - `opus` / `sonnet` / `haiku` are FLOATING aliases — they track whatever the host maps
#   them to today. An exact model id PINS the choice; prefer a pin where review evidence
#   must stay comparable across runs (`adversarial_review`, `sensitive_implementation`).
# - `adversarial_review` prefers a DIFFERENT family from the implementer when one is
#   reachable: a same-family reviewer shares the implementer's blind spots. When none is
#   reachable the review still runs and is reported as a same-family review. Family
#   diversity reduces correlated blind spots; it is never proof of correctness.
#
# ONE OPERATOR'S ACTUAL SETUP — a worked example of the above, nothing more.
# It is NOT a Flow default, NOT a recommendation, and NOT a claim that any of these
# models exists on, or is reachable from, your host. Copy it only if you have verified
# every name against your own provider. The shipped rows above stay null.
#
#   tiers:
#     planning:                 { model: "claude-opus-5-5", family: null }  # Opus 5.5, extra-high effort
#     adversarial_review:       { model: "gpt-6-astra",     family: null }  # GPT-6 Astra, high effort
#     sensitive_implementation: { model: "claude-opus-5-5", family: null }  # Opus 5.5, high effort
#     routine_implementation:   { model: "claude-opus-5-5", family: null }  # Opus 5.5, high effort
#     execution:                { model: "claude-opus-5-5", family: null }  # Opus 5.5, high effort
#
# - Effort is a session setting, not a key in this file (task-delegation § Model routing),
#   so it appears only as a comment.
# - For real decisions this operator also plans with Fable 5.1 (`claude-fable-5-1`).
# - `adversarial_review` is a different family from the implementer. Its backup is GPT-6.1 Sol
#   (`gpt-6.1-sol`), switched in by hand: the schema holds one model per tier.
# - `gpt-6.1-sol` is listed only by Codex CLI 0.160.0 or later (`codex debug models`).
#
# In that setup every implementation tier is an Anthropic-family model, so the reviewer
# is deliberately drawn from another vendor (OpenAI). If no OpenAI reviewer is reachable
# the run does not stop — it falls back and reports a same-family review.
